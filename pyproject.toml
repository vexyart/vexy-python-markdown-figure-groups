# this_file: pyproject.toml
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vexy-python-markdown-figure-groups"
dynamic = ["version"]
description = "Group a margin figure with the paragraphs it illustrates in rendered HTML."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vexy Lines Team", email = "help@vexy.art" }]
dependencies = ["Markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-Markdown"]

[project.urls]
Homepage = "https://github.com/vexyart/vexy-python-markdown-figure-groups"
Repository = "https://github.com/vexyart/vexy-python-markdown-figure-groups"

[project.entry-points."markdown.extensions"]
figure_groups = "vexy_markdown_figure_groups:FigureGroupsExtension"

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/vexy_markdown_figure_groups/__version__.py"
template = """
# this_file: src/vexy_markdown_figure_groups/__version__.py
# Generated by hatch-vcs.
__version__ = "{version}"
"""

[tool.hatch.build.targets.wheel]
packages = ["src/vexy_markdown_figure_groups"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md", "AGENTS.md", "DEPENDENCIES.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "PIE", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
